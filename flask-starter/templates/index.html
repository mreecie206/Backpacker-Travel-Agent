<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Backpacker Travel Agent</title>
  <style>
    :root { --ink: #17211b; --muted: #65736a; --paper: #f5f1e8; --panel: #fffdf8; --green: #1d6b4f; --orange: #dd713f; --line: #d8d8ca; }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: radial-gradient(circle at 90% 0%, #dbe8d1 0, transparent 32%), var(--paper); font: 16px/1.5 Georgia, serif; }
    main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
    header { display: flex; justify-content: space-between; gap: 24px; align-items: end; margin-bottom: 34px; }
    h1 { max-width: 650px; margin: 0; font: 700 clamp(2.4rem, 7vw, 5.5rem)/.95 Georgia, serif; letter-spacing: -2px; }
    h1 span { color: var(--orange); }
    .tag { max-width: 250px; color: var(--muted); }
    .layout { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(280px, .9fr); gap: 22px; }
    section { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); padding: 26px; box-shadow: 8px 8px 0 #dce6d6; }
    h2 { margin: 0 0 18px; font-size: 1.35rem; }
    label { display: block; margin: 15px 0 6px; font-weight: bold; }
    input { width: 100%; border: 1px solid #b9c1b8; background: #fff; padding: 12px 13px; color: var(--ink); font: inherit; }
    .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    button { border: 0; background: var(--green); color: white; padding: 12px 17px; margin-top: 20px; cursor: pointer; font: 700 15px Georgia, serif; }
    button:hover { background: #124c38; }
    button.secondary { background: var(--orange); margin: 0; }
    .country-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
    #countries { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0; margin: 0; list-style: none; }
    #countries button { width: 100%; text-align: left; margin: 0; padding: 9px 11px; background: #edf3e8; color: var(--green); }
    #countries button:hover { background: #dcebd6; }
    #result { min-height: 100px; margin: 22px 0 0; padding: 16px; overflow: auto; background: #18231d; color: #d9edce; font: 13px/1.5 monospace; white-space: pre-wrap; }
    .status { color: var(--muted); font-size: .9rem; }
    @media (max-width: 760px) { header, .layout { display: block; } .tag { margin-top: 18px; } section { margin-top: 22px; } .fields { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Go farther.<br><span>Spend smarter.</span></h1>
      <p class="tag">A practical trip planner for curious people with a backpack and a real budget.</p>
    </header>
    <div class="layout">
      <section>
        <h2>Plan a route</h2>
        <form id="trip-form">
          <div class="fields">
            <div><label for="origin">Starting point</label><input id="origin" name="origin" required placeholder="Seattle"></div>
            <div><label for="destination">Destination country</label><input id="destination" name="destination" required placeholder="Vietnam"></div>
          </div>
          <label for="cities">Cities, comma separated</label>
          <input id="cities" name="cities" placeholder="Hanoi, Da Nang, Ho Chi Minh City">
          <label for="countries">Countries, comma separated</label>
          <input id="countries-input" name="countries" placeholder="Vietnam, Vietnam, Vietnam">
          <div class="fields">
            <div><label for="budget">Total budget (optional)</label><input id="budget" name="budget" type="number" min="0" placeholder="800"></div>
            <div><label for="weekly-budget">Weekly budget (optional)</label><input id="weekly-budget" name="weekly_budget" type="number" min="0" placeholder="350"></div>
          </div>
          <button type="submit">Build my plan</button>
        </form>
        <pre id="result" aria-live="polite">Your trip plan will appear here.</pre>
      </section>
      <section>
        <div class="country-tools"><h2>Supported countries</h2><button class="secondary" id="refresh" type="button">Refresh</button></div>
        <p class="status" id="country-status">Loading country data...</p>
        <ul id="countries"></ul>
      </section>
    </div>
  </main>
  <script>
    const result = document.querySelector('#result');
    const countryList = document.querySelector('#countries');
    const countryStatus = document.querySelector('#country-status');

    async function loadCountries() {
      countryStatus.textContent = 'Loading country data...';
      try {
        const response = await fetch('/api/countries');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not load countries');
        countryList.innerHTML = '';
        data.countries.forEach(country => {
          const item = document.createElement('li');
          const button = document.createElement('button');
          button.type = 'button';
          button.textContent = country;
          button.addEventListener('click', () => showCountry(country));
          item.appendChild(button);
          countryList.appendChild(item);
        });
        countryStatus.textContent = `${data.count} destinations with local cost data`;
      } catch (error) { countryStatus.textContent = error.message; }
    }

    async function showCountry(country) {
      const response = await fetch(`/api/countries/${encodeURIComponent(country)}`);
      result.textContent = JSON.stringify(await response.json(), null, 2);
    }

    document.querySelector('#refresh').addEventListener('click', loadCountries);
    document.querySelector('#trip-form').addEventListener('submit', async event => {
      event.preventDefault();
      const form = new FormData(event.target);
      const payload = {
        origin: form.get('origin'), destination: form.get('destination'),
        cities: form.get('cities').split(',').map(value => value.trim()).filter(Boolean),
        countries: form.get('countries').split(',').map(value => value.trim()).filter(Boolean),
      };
      if (form.get('budget')) payload.budget = Number(form.get('budget'));
      if (form.get('weekly_budget')) payload.weekly_budget = Number(form.get('weekly_budget'));
      result.textContent = 'Planning...';
      try {
        const response = await fetch('/api/plan_trip', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
        result.textContent = JSON.stringify(await response.json(), null, 2);
      } catch (error) { result.textContent = JSON.stringify({error: error.message}, null, 2); }
    });
    loadCountries();
  </script>
</body>
</html>
